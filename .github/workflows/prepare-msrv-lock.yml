name: Prepare Rust 1.85 lock

on:
  pull_request:
    paths:
      - .github/workflows/prepare-msrv-lock.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve exact compatible build dependency with production compiler
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:1.85-bookworm \
            cargo update -p psm --precise 0.1.28
          git diff -- Cargo.lock
      - name: Retain resolver-produced lock for review
        uses: actions/upload-artifact@v4
        with:
          name: rust185-reviewed-Cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
